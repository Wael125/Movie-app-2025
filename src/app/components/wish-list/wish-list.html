    <div class="movie-list">
          <header class="wishlist-header">
              <h1>Ma Wishlist 🎬</h1>
              <p>Retrouvez ici tous vos films favoris !</p>
          </header>
    @for (movie of movieService.wishList; track movie.id) {
    <div class="movie-card" (click)="navigateTo(movie.id)">
        <img [src]="`https://image.tmdb.org/t/p/w500/${movie.poster_path}`">
    
        <div class="movie-details">
            <h2>
                {{movie.title}}
            </h2>
        </div>
    </div>
}
</div>
